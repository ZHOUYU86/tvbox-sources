name: health-check
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 全量体检（输出 JSON 报告）
        run: |
          python3 scripts/health_check.py --json > /tmp/health.json
          cat /tmp/health.json
        continue-on-error: true

      - name: 自动精准修复（剥字段 / 重跑同步）
        run: |
          python3 scripts/auto_repair.py --report /tmp/health.json

      - name: 等待修复生效
        run: sleep 240

      - name: 复检确认
        run: |
          python3 scripts/health_check.py --json > /tmp/health2.json
          cat /tmp/health2.json

      - name: 修复后仍异常则发邮件通知
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: 863904696@qq.com
        run: python3 .github/scripts/notify_failure.py
