name: update-live-tv

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run live tv updater
        run: python scripts/update_lives_tv.py

      - name: Commit and push
        run: |
          git config user.name "doubao-agent"
          git config user.email "doubao-agent@users.noreply.github.com"
          git add lives_tv.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "auto update live tv sources $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push; then
                echo "push ok (attempt $i)"
                break
              fi
              echo "push retry (attempt $i)"
              sleep 10
            done
          fi

      - name: 失败通知邮箱
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: 863904696@qq.com
        run: python3 .github/scripts/notify_failure.py
