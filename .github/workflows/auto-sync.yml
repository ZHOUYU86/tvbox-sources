name: Auto Sync Upstream

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync from ChineseModernTV/TVBox
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_repository: ChineseModernTV/TVBox
          upstream_branch: main
          target_branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
          target_sync_force: false

      - name: Sync from YuanGuanXin/TVBox_OS
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_repository: YuanGuanXin/TVBox_OS
          upstream_branch: main
          target_branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
          target_sync_force: false
