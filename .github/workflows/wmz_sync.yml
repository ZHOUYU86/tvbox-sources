name: wmz-sync
on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行 wmz 独有源同步脚本
        env:
          WMZ_OUT: wmz/wmz.json
          WMZ_UPSTREAM: "https://8815.kstore.vip/tvbox/wmz"
        run: |
          mkdir -p wmz
          python .github/scripts/wmz_sync.py

      - name: 剥除 WMZ 扩展字段（兼容老版OK影视，防闪退）
        run: |
          python3 scripts/strip_fongmi_extra.py wmz/wmz.json || true

      - name: 有变化则提交（并发安全）
        run: |
          git config user.name "zhouyu86-bot"
          git config user.email "863904696@qq.com"
          git add wmz
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "sync wmz unique sources $(date -u +%Y%m%d%H%M)"
            git pull --rebase origin main || true
            git push
          fi

      - name: 失败通知邮箱
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: 863904696@qq.com
        run: python3 .github/scripts/notify_failure.py
