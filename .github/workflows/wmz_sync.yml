name: wmz-sync
on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行 wmz 独有源同步脚本
        env:
          WMZ_OUT: wmz/wmz.json
          WMZ_UPSTREAM: "https://8815.kstore.vip/tvbox/wmz"
        run: |
          mkdir -p wmz
          python .github/scripts/wmz_sync.py

      - name: 有变化则提交
        run: |
          if git diff --quiet; then
            echo "无变化"
          else
            git config user.name "zhouyu86-bot"
            git config user.email "863904696@qq.com"
            git add wmz
            git commit -m "sync wmz unique sources $(date -u +%Y%m%d%H%M)"
            git push
          fi
