name: pg-aowu-sync
on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取 PG 接口内容（pg/pg.json + pg/pg.jar）
        run: |
          mkdir -p pg aowu
          curl -L --max-time 120 -o pg/pg.json "https://www.252035.xyz/p/jsm.json"
          curl -L --max-time 300 -o pg/pg.jar "https://www.252035.xyz/p/pg.jar"

      - name: 拉取嗷呜接口内容（aowu/aowu.json）
        run: |
          curl -L --max-time 120 -o aowu/aowu.json "https://9763.kstore.vip/aowu.json"

      - name: 剥注释并修正 spider 为完整网址
        run: |
          python3 - <<'EOF'
          import re
          for f, url in [
              ("pg/pg.json", "https://zhouyu365666.top/pg/pg.jar"),
              ("aowu/aowu.json", "https://zhouyu365666.top/aowu/custom_spider.jar;md5;a37b5c22b56c4dce38b519ee92256a8e"),
          ]:
              s = open(f, encoding="utf-8").read()
              s = re.sub(r'^\s*//.*$', '', s, flags=re.M)
              s = re.sub(r'"spider"\s*:\s*"[^"]*"', '"spider":"' + url + '"', s, count=1)
              open(f, "w", encoding="utf-8").write(s)
          EOF

      - name: 剥除 PG 扩展字段（兼容老版OK影视，防闪退）
        run: |
          python3 scripts/strip_fongmi_extra.py pg/pg.json

      - name: 有变化则提交
        run: |
          if git diff --quiet; then
            echo "无变化"
          else
            git config user.name "zhouyu86-bot"
            git config user.email "863904696@qq.com"
            git add pg aowu
            git commit -m "sync pg/aowu content $(date -u +%Y%m%d%H%M)"
            git push
          fi
