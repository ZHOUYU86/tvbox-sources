name: pg-aowu-sync
on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取 PG 接口内容（pg/pg.json + pg/pg.jar）
        run: |
          mkdir -p pg aowu
          curl -L --max-time 120 -o pg/pg.json "https://www.252035.xyz/p/jsm.json"
          curl -L --max-time 300 -o pg/pg.jar "https://www.252035.xyz/p/pg.jar"

      - name: 拉取嗷呜接口内容（aowu/aowu.json）
        run: |
          curl -L --max-time 120 -o aowu/aowu.json "https://9763.kstore.vip/aowu.json"

      - name: 同步上游 lib 配置文件（pg/lib）
        run: |
          mkdir -p pg/lib
          python3 - <<'EOF'
          import os, re, urllib.request
          need = [
            "123share.txt","189share.txt","115share.txt","alishare.ebook.txt","alishare.txt",
            "alist.min.js","biptv.txt","douban.json","feimaolive.json","live2vod.js",
            "moli.json","pikpakclass.json","pushshare.txt","quarkshare.txt","tgsearch.json",
            "thundershare.txt","ucshare.txt","wogg.json","yo21.txt",
          ]
          ok = fail = 0
          for f in need:
              try:
                  req = urllib.request.Request("https://www.252035.xyz/p/lib/" + f, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=40) as r:
                      b = r.read()
                  open("pg/lib/" + f, "wb").write(b)
                  ok += 1
              except Exception:
                  fail += 1
          print(f"lib 同步: ok={ok} fail={fail}")
          EOF

      - name: 剥注释、下载 jar、动态 md5、spider 改相对路径
        run: |
          python3 - <<'EOF'
          import hashlib, re, urllib.request

          def fetch(url, timeout=60):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          def finalize(f, jar_name, jar_url=None):
              s = open(f, encoding="utf-8").read()
              s = re.sub(r'^\s*//.*$', '', s, flags=re.M)
              if jar_url:
                  try:
                      b = fetch(jar_url)
                      open(jar_name, "wb").write(b)
                      print("jar 下载:", jar_name, len(b), "B")
                  except Exception as e:
                      print("jar 下载失败保留现有:", e)
              b = open(jar_name, "rb").read()
              md5 = hashlib.md5(b).hexdigest()
              jn = jar_name.split("/")[-1]
              s = re.sub(r'"spider"\s*:\s*"[^"]*"', f'"spider":"./{jn};md5;{md5}"', s, count=1)
              open(f, "w", encoding="utf-8").write(s)
              print(f, "spider ->", f"./{jn};md5;{md5}")

          finalize("pg/pg.json", "pg/pg.jar", "https://www.252035.xyz/p/pg.jar")
          s = open("aowu/aowu.json", encoding="utf-8").read()
          m = re.search(r'"spider"\s*:\s*"([^"]*)"', s)
          aowu_jar = m.group(1).split(";")[0] if m else None
          print("aowu 上游 jar URL:", aowu_jar)
          finalize("aowu/aowu.json", "aowu/custom_spider.jar", aowu_jar)
          EOF

      - name: 剥除 PG/嗷呜扩展字段（兼容老版OK影视，防闪退）
        run: |
          python3 scripts/strip_fongmi_extra.py pg/pg.json aowu/aowu.json

      - name: 有变化则提交（并发安全）
        run: |
          git config user.name "zhouyu86-bot"
          git config user.email "863904696@qq.com"
          git add pg aowu
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "sync pg/aowu content $(date -u +%Y%m%d%H%M)"
            git pull --rebase origin main || true
            git push
          fi
