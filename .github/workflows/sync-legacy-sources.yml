name: sync-legacy-sources
on:
  schedule:
    - cron: "30 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 同步老 10 源（fty/wex/nf/feimao/cl/ouyang/lubin/dl/tvurl/xs）
        run: |
          python3 scripts/sync_legacy.py

      - name: 剥除 FongMi 扩展字段（兼容老版OK影视，防闪退）
        run: |
          python3 - <<'EOF'
          import glob, subprocess, sys
          for f in sorted(glob.glob("*/api.json")):
              r = subprocess.run([sys.executable, "scripts/strip_fongmi_extra.py", f])
              if r.returncode != 0:
                  print("跳过(无扩展字段或异常):", f)
          EOF

      - name: 有变化则提交（并发安全）
        run: |
          git config user.name "zhouyu86-bot"
          git config user.email "863904696@qq.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "sync legacy sources $(date -u +%Y%m%d%H%M)"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push; then
                echo "push 成功 (attempt $i)"
                break
              fi
              echo "push 冲突重试 (attempt $i)"
              sleep 10
            done
          fi

      - name: 失败通知邮箱
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: 863904696@qq.com
        run: python3 .github/scripts/notify_failure.py
