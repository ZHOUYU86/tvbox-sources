name: Auto Spider - TVBox接口自动爬虫

# 触发条件
on:
  # 每天定时运行（北京时间早上8点）
  schedule:
    - cron: '0 0 * * *'  # UTC时间0点 = 北京时间8点
  # 手动触发
  workflow_dispatch:

# 权限
permissions:
  contents: write

jobs:
  spider:
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 运行爬虫
      - name: Run spider
        run: |
          cd auto-spider
          python spider.py

      # 提交更改
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "Auto update: 更新TVBox接口 $(date +'%Y-%m-%d %H:%M')"
          git push
