name: 影视源自动同步+清理垃圾+失败告警

on:
  schedule:
    # 北京时间晚上22:00跑
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置Git
        run: |
          git config --global user.name "Auto-Sync"
          git config --global user.email "auto@sync.com"

      - name: 强制同步上游仓库（完全一致）
        run: |
          echo "开始同步上游仓库..."
          git remote add upstream https://github.com/fish2018/tvbox_tools.git || echo "上游已存在"
          git fetch upstream
          git reset --hard upstream/main
          git push --force origin main
          echo "同步完成，已和上游完全一致"

      - name: 清理垃圾文件（只删缓存，不碰源文件）
        run: |
          echo "开始清理缓存和临时文件..."
          if [ -d ".wrangler/cache" ]; then
            rm -rf .wrangler/cache/*
            echo "已清理 .wrangler/cache"
          else
            echo "无.wrangler/cache目录，跳过"
          fi
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          echo "清理完成"

      - name: 同步失败时发邮件告警
        if: failure()
        env:
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
        run: python send_alert.py
