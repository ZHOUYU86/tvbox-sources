name: 影视源自动同步+健康检测+清理垃圾+邮件告警

on:
  schedule:
    # 北京时间晚上20:30跑，错开凌晨2点/4点的自动更新脚本
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync-monitor-clean:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置Git
        run: |
          git config --global user.name "Auto-Sync"
          git config --global user.email "auto@sync.com"

      - name: 自动同步上游仓库
        run: |
          echo "开始同步上游仓库..."
          git remote add upstream https://github.com/fish2018/tvbox_tools.git || echo "上游已存在"
          git fetch upstream || echo "拉取上游失败"
          git merge upstream/main --allow-unrelated-histories -m "自动同步上游最新影视源" || echo "合并冲突或无更新"
          git push || echo "无更新跳过"

      - name: 安装Python依赖
        run: pip install requests PyYAML

      - name: 健康检测所有影视源
        id: health
        run: python check_sources.py

      - name: 自动清理垃圾（白名单保护）
        run: |
          echo "开始清理缓存和临时文件..."
          if [ -d ".wrangler/cache" ]; then
            rm -rf .wrangler/cache/*
            echo "已清理 .wrangler/cache"
          else
            echo "无.wrangler/cache目录，跳过"
          fi
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          echo "清理完成"

      - name: 有坏源时发邮件告警
        if: steps.health.outputs.failed_count != '0'
        env:
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
        run: |
          pip install smtplib
          python3 -c "
          import json, smtplib, os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime

          with open('monitor/result.json', 'r', encoding='utf-8') as f:
              result = json.load(f)
          failed = result['failed']
          success = result['success']

          body = f'检测时间: {datetime.now().strftime("%Y-%m-%d %H:%M")}\n'
          body += f'正常: {len(success)}个, 异常: {len(failed)}个\n\n'
          body += '异常源列表:\n'
          for s in failed:
              body += f'- {s["name"]} ({s.get("from_file","")}): {s.get("error","")}\n'

          msg = MIMEMultipart()
          msg['From'] = '863904696@qq.com'
          msg['To'] = '863904696@qq.com'
          msg['Subject'] = f'[影视源告警] {len(failed)}个源异常 - {datetime.now().strftime("%m-%d %H:%M")}'
          msg.attach(MIMEText(body, 'plain', 'utf-8'))

          server = smtplib.SMTP_SSL('smtp.qq.com', 465)
          server.login('863904696@qq.com', os.environ['QQ_SMTP_AUTH_CODE'])
          server.sendmail('863904696@qq.com', '863904696@qq.com', msg.as_string())
          server.quit()
          print('告警邮件已发送')
          "

      - name: 自动提交结果
        run: |
          git add -A
          git commit -m "自动同步+健康检测+清理垃圾" || echo "没有改动"
          git push || echo "推送失败"
