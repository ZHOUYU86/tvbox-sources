name: 影视源自动同步+健康检测+清理垃圾

on:
  schedule:
    - cron: '45 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync-monitor-clean:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置Git
        run: |
          git config --global user.name "Auto-Sync"
          git config --global user.email "auto@sync.com"

      - name: 自动同步上游仓库
        run: |
          echo "开始同步上游仓库..."
          git remote add upstream https://github.com/fish2018/tvbox_tools.git || echo "上游已存在"
          git fetch upstream || echo "拉取上游失败"
          git merge upstream/main --allow-unrelated-histories -m "自动同步上游最新影视源" || echo "合并冲突或无更新"
          git push || echo "无更新跳过"

      - name: 安装Python依赖
        run: pip install requests PyYAML

      - name: 健康检测所有影视源
        run: python check_sources.py

      - name: 自动清理垃圾
        run: |
          echo "开始清理缓存和临时文件..."
          rm -rf .wrangler/cache/* 2>/dev/null || echo "无wrangler缓存"
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          echo "清理完成"

      - name: 自动提交结果
        run: |
          git add -A
          git commit -m "自动同步上游+健康检测+清理垃圾" || echo "没有改动"
          git push || echo "推送失败"
