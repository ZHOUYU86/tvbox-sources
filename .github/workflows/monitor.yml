name: 影视源AI自动同步+监控修复

on:
  schedule:
    # 每天早上8:45跑，错开凌晨4点的现有健康检查，留足4小时间隔，完全不冲突
    - cron: '45 8 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  actions: write

jobs:
  sync-and-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取自己的仓库代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装最新版Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置Git
        run: |
          git config --global user.name "Auto-Sync"
          git config --global user.email "auto@sync.com"

      - name: 自动同步上游仓库配置
        run: |
          # 自动同步常用上游影视源仓库
          echo "开始同步上游仓库最新配置..."
          git remote add upstream https://github.com/fish2018/tvbox_tools.git || echo "上游已存在"
          git fetch upstream || echo "拉取上游失败，继续巡检"
          git merge upstream/main --allow-unrelated-histories -m "🔄 AI自动同步上游最新影视源" || echo "合并冲突或无更新，继续巡检"
          git push || echo "无更新，跳过push"

      - name: 装Python依赖
        run: |
          pip install requests PyYAML

      - name: 跑巡检脚本
        id: monitor
        run: python monitor/check_sources.py

      - name: 有挂的源自动让AI修复
        if: steps.monitor.outputs.failed_sources != '[]'
        run: python monitor/ai_fix.py
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}

      - name: 自动提交修复后的代码
        run: |
          git add -A
          git commit -m "🤖 AI自动同步上游+修复挂掉的源" || echo "没有改动"
          git push
